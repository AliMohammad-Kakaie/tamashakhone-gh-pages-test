<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>تماشاخونه — انتقال هدایت‌شده</title><style>body{max-width:40rem;margin:2rem auto;padding:1rem;background:#17181b;color:#eee;font:1rem system-ui}input,button{font:inherit;margin:.5rem;padding:.7rem;max-width:95%}button{cursor:pointer}output{display:block;overflow-wrap:anywhere}</style><h1>انتقال هدایت‌شدهٔ تماشاخونه</h1><p>فقط مالک؛ هیچ داده‌ای در این صفحه ذخیره نمی‌شود.</p><form id="login"><input id="username" aria-label="نام کاربری" autocomplete="username" required><input id="password" aria-label="رمز عبور" type="password" autocomplete="current-password" required><button>ورود</button></form><button id="probe">آزمون بدون داده</button><input type="file" id="file" accept="application/json,.json" aria-label="فایل آرشیو"><button id="send">ارسال فایل پس از تأیید مالک</button><button id="checks">کنترل‌های بدون درج داده</button><button id="logout">خروج</button><output id="status" role="status"></output><script type="module" src="./importer.mjs"></script></html>
